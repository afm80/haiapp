name: haiapp
description: HaiApp - تطبيق محادثة
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  intl: any
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  agora_rtc_engine: ^6.5.0
  permission_handler: ^11.3.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  flutter_contacts: ^1.1.9+2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
